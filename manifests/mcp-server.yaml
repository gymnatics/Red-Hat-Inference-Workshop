# Kubernetes MCP Server — provides cluster query tools for LLM tool calling
#
# Deploys an MCP server in the participant's namespace with read-only
# cluster access. Provides tools like listing pods, namespaces, deployments,
# services, and viewing logs.
#
# Resources created:
#   - ServiceAccount: identity for the MCP server pod
#   - ClusterRoleBinding: grants cluster-wide read access (view role)
#   - Deployment: runs the MCP server container
#   - Service: exposes the MCP server within the cluster
#
# Usage:
#   export NAMESPACE=user-XX
#   envsubst < manifests/mcp-server.yaml | oc apply -f -
#
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server-${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp-server
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: ${NAMESPACE}
  labels:
    app: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      containers:
      - name: server
        image: quay.io/redhat-ai-services/kubernetes-mcp-server
        args: ["--port=8080", "--read-only"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: ${NAMESPACE}
  labels:
    app: kubernetes-mcp-server
spec:
  selector:
    app: kubernetes-mcp-server
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
