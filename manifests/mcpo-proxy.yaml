# mcpo — MCP-to-OpenAPI proxy for Open WebUI tool integration
#
# Wraps the Kubernetes MCP server as an OpenAPI-compatible endpoint
# that Open WebUI can reliably discover and call tools from.
#
# Resources created:
#   - ConfigMap: mcpo configuration pointing to the MCP server
#   - Deployment: runs the mcpo proxy container
#   - Service: exposes the proxy at port 8000
#
# Usage:
#   export NAMESPACE=user-XX
#   sed "s|\${NAMESPACE}|$NAMESPACE|g" manifests/mcpo-proxy.yaml | oc apply -f -
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpo-config
  namespace: ${NAMESPACE}
data:
  config.json: |
    {
      "mcpServers": {
        "kubernetes": {
          "type": "streamable-http",
          "url": "http://kubernetes-mcp-server.${NAMESPACE}.svc.cluster.local:8080/mcp"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: ${NAMESPACE}
  labels:
    app: mcpo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
    spec:
      containers:
      - name: mcpo
        image: ghcr.io/open-webui/mcpo:main
        args:
        - --config
        - /app/config.json
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: mcpo-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcpo
  namespace: ${NAMESPACE}
  labels:
    app: mcpo
spec:
  selector:
    app: mcpo
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
