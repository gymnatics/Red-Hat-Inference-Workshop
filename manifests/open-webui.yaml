# Open WebUI + mcpo proxy — chat interface with MCP tool support
#
# Deploys Open WebUI (v0.9.0) and the mcpo proxy in a participant's
# namespace. The mcpo proxy converts MCP tools to OpenAPI endpoints
# that Open WebUI can call reliably.
#
# Resources created (8 total):
#   - ConfigMap (openwebui-config) — base configuration
#   - PersistentVolumeClaim — 2Gi storage for OpenWebUI data
#   - Deployment (open-webui) — the Open WebUI container
#   - Service (open-webui) — internal cluster access on port 8080
#   - Route (open-webui) — external HTTPS URL for your browser
#   - ConfigMap (mcpo-config) — proxy config pointing to MCP server
#   - Deployment (mcpo) — the mcpo proxy container
#   - Service (mcpo) — exposes the proxy at port 8000
#
# Usage:
#   export NAMESPACE=user-XX
#   sed "s/\${NAMESPACE}/$NAMESPACE/g" manifests/open-webui.yaml | oc apply -f -
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: ${NAMESPACE}
data:
  ENABLE_OLLAMA_API: "False"
  OPENAI_API_BASE_URLS: ""
  OPENAI_API_KEYS: ""
  WEBUI_AUTH: "False"
  WEBUI_SECRET_KEY: "rhoai-workshop-secret-key"
  MCP_ENABLE: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ${NAMESPACE}
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.9.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: openwebui-config
          env:
            - name: ENABLE_PERSISTENT_CONFIG
              value: "False"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ${NAMESPACE}
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: open-webui
  namespace: ${NAMESPACE}
  labels:
    app: open-webui
spec:
  to:
    kind: Service
    name: open-webui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpo-config
  namespace: ${NAMESPACE}
data:
  config.json: |
    {
      "mcpServers": {
        "kubernetes": {
          "type": "streamable-http",
          "url": "http://kubernetes-mcp-server.${NAMESPACE}.svc.cluster.local:8080/mcp"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: ${NAMESPACE}
  labels:
    app: mcpo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
    spec:
      containers:
      - name: mcpo
        image: ghcr.io/open-webui/mcpo:main
        args:
        - --config
        - /app/config.json
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: mcpo-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcpo
  namespace: ${NAMESPACE}
  labels:
    app: mcpo
spec:
  selector:
    app: mcpo
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
